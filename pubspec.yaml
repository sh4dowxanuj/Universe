name: universe
description: An Open Source Music Player App.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.1.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  app_links: ^6.3.0
  audio_metadata_reader: ^1.0.0
  audio_service: ^0.18.12
  audio_session: any
  cached_network_image: ^3.3.0
  carousel_slider: 5.0.0
  community_material_icon: ^5.9.55
  connectivity_plus: ^5.0.1
  cupertino_icons: ^1.0.6
  dart_des: ^1.0.2
  device_info_plus: 13.2.0
  file_selector: ^1.1.0
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  flutter_archive: ^6.3.1
  flutter_displaymode: ^0.6.0
  flutter_localizations:
    sdk: flutter
  flutter_lyric: ^2.0.4+6
  get_it: ^7.6.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.9.3
  html_unescape: ^2.0.0
  http: ^1.2.0
  intl: any
  just_audio: ^0.9.36
  logging: ^1.2.0
  marquee_plus: 2.2.4
  metadata_god: ^0.5.2+1
  on_audio_query: ^2.9.0
  package_info_plus: 10.2.1
  palette_generator: ^0.3.3+3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  persistent_bottom_nav_bar: ^5.0.2
  receive_sharing_intent: ^1.9.0
  rxdart: any
  share_plus: 13.3.0
  sizer: ^2.0.15
  sliding_up_panel: ^2.0.0+1
  url_launcher: ^6.1.14
  uuid: ^3.0.7

dependency_overrides:
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.1.2
  msix: ^3.16.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets to the application.
    - assets/

msix_config:
  display_name: BlackHole
  publisher_display_name: SH4DOWXANUJ
  identity_name: com.shadow.blackhole
  icons_background_color: transparent
  logo_path: assets/ic_launcher.png
  file_extension: .mp3, .m4a
