  permission_handler: ^13.0.0
  persistent_bottom_nav_bar: ^6.2.1
  receive_sharing_intent: ^1.4.5
  share_plus: ^13.3.0
  sizer: ^3.1.3
  sliding_up_panel: ^2.0.0+1
  url_launcher: ^6.1.14
  uuid: ^4.6.0
  workmanager: ^0.10.7
  youtube_explode_dart: ^3.1.0

  intl: any
  rxdart: any
  audio_session: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.1.2
  msix: ^3.16.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets to the application.
    - assets/

msix_config:
  display_name: BlackHole
  publisher_display_name: SH4DOWXANUJ
  identity_name: com.shadow.blackhole
  icons_background_color: transparent
  logo_path: assets/ic_launcher.png
  file_extension: .mp3, .m4a