name: universe
description: An Open Source Music Player App.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.1.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  app_links: ^7.2.1
  audio_service: ^0.18.12
  # bitsdojo_window: ^0.1.1+1 #For Desktops
  cached_network_image: ^3.3.0
  carousel_slider: ^5.1.2
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.6
  dart_des: ^1.0.2
  device_info_plus: ^13.2.0
  # ffmpeg_kit_flutter_audio: ^6.0.3
  file_picker: ^12.0.0-beta.7
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  flutter_archive: ^6.3.1
  flutter_displaymode: ^0.7.0
  # flutter_downloader: ^1.7.1
  flutter_localizations:
    sdk: flutter
  flutter_lyric: ^3.0.7
  get_it: ^9.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.9.3
  html_unescape: ^2.0.0
  http: ^1.2.0
  just_audio: ^0.10.6
  # Discontinued, Use just_audio_windows instead.
  # just_audio_libwinmedia: ^0.0.4 # For windows and linux.
  logging: ^1.2.0
  marquee: ^2.2.3
  community_material_icon: ^5.9.55
