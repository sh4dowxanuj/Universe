plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'


// ============================================================
// Cross-platform Chaquopy Python detection
// ============================================================

def chaquopyBuildPython = null

def isWindows = System.getProperty("os.name")
        .toLowerCase()
        .contains("windows")

if (isWindows) {

    // Try "python" first.
    try {
        def process = ["python", "-c", "import sys; print(sys.executable)"].execute()
        process.waitFor()

        if (process.exitValue() == 0) {
            def detectedPython = process.text.trim()

            if (detectedPython && new File(detectedPython).exists()) {
                chaquopyBuildPython = detectedPython
            }
        }
    } catch (Exception ignored) {
        // Try the Windows Python launcher below.
    }

    // If "python" wasn't found, try "py".
    if (chaquopyBuildPython == null) {
        try {
            def process = ["py", "-3", "-c", "import sys; print(sys.executable)"].execute()
            process.waitFor()

            if (process.exitValue() == 0) {
                def detectedPython = process.text.trim()

                if (detectedPython && new File(detectedPython).exists()) {
                    chaquopyBuildPython = detectedPython
                }
            }
        } catch (Exception ignored) {
            // Python not found.
        }
    }

} else {

    // Linux/macOS: try python3 first.
    try {
        def process = ["python3", "-c", "import sys; print(sys.executable)"].execute()
        process.waitFor()

        if (process.exitValue() == 0) {
            def detectedPython = process.text.trim()

            if (detectedPython && new File(detectedPython).exists()) {
                chaquopyBuildPython = detectedPython
            }
        }
    } catch (Exception ignored) {
        // Try python below.
    }

    // Fallback to "python".
    if (chaquopyBuildPython == null) {
        try {
            def process = ["python", "-c", "import sys; print(sys.executable)"].execute()
            process.waitFor()

            if (process.exitValue() == 0) {
                def detectedPython = process.text.trim()

                if (detectedPython && new File(detectedPython).exists()) {
                    chaquopyBuildPython = detectedPython
                }
            }
        } catch (Exception ignored) {
            // Python not found.
        }
    }
}


if (chaquopyBuildPython == null) {
    throw new GradleException(
        "Chaquopy could not find a usable Python interpreter. " +
        "Please make sure Python is installed and available in PATH."
    )
}

println("Chaquopy build Python: " + chaquopyBuildPython)


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace "com.shadow.universe"

    compileSdkVersion 37
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.shadow.universe"

        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        python {
            version "3.11"

            buildPython chaquopyBuildPython

            pyc {
                src false
            }

            pip {
                install "yt-dlp>=2023.11.16"
            }
        }
    }


    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']

                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }


    buildTypes {
        release {
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            shrinkResources true

            // Cleaned up: only points to your custom proguard rules file
            proguardFiles 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }


    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }


    packagingOptions {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }


    buildFeatures {
        viewBinding true
    }
}


flutter {
    source '../..'
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
}