buildscript {
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.chaquo.python:gradle:16.0.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    project.afterEvaluate { proj ->
        if (proj.hasProperty('android')) {
            proj.android {
                compileSdk = 37

                // Force Java 17 for all Android modules
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }

                // Fix missing namespace in older Flutter plugins
                if (namespace == null) {
                    namespace = proj.group ?: "com.example.${proj.name.replace('-', '_')}"
                }

                // Use installed NDK version
                ndkVersion = "28.2.13676358"
            }
        }

        // Force Kotlin JVM target to Java 17 across all subprojects
        proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    }

    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}