# =============================================================
# MEMORY & JVM OPTIMIZATIONS (Tailored for 4GB RAM + E5700)
# =============================================================
# Limit heap to 1.5GB so Gradle fits in physical RAM without paging
org.gradle.jvmargs=-Xmx1536M -XX:+UseG1GC -Dfile.encoding=UTF-8

# Disable persistent daemon to free RAM immediately after build completes
org.gradle.daemon=false

# Disable parallel execution (E5700 dual-core handles single-threaded better)
org.gradle.parallel=false

# Enable build caching (configuration caching disabled due to Chaquopy plugin incompatibility)
org.gradle.caching=true
org.gradle.configuration-cache=false

# =============================================================
# ANDROID & AGP OPTIMIZATIONS
# =============================================================
android.useAndroidX=true

# Turn off Jetifier if your libraries support AndroidX (huge CPU/RAM saver)
android.enableJetifier=false

# Enable R8 Full Mode for faster, more aggressive code shrinking
android.enableR8.fullMode=true

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Temporarily suppress unsupported compileSdk warning for AGP with compileSdk 37.0
android.suppressUnsupportedCompileSdk=37.0
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Opt out of AGP 9 new DSL & built-in Kotlin enforcement for external plugin compatibility
android.newDsl=false
android.builtInKotlin=false
